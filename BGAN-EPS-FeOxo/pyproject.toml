[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgan-eps-feoxo"
version = "0.1.0"
description = "Modified BGAN-EPS for custom reaction coordinates and subset configurational entropy"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
    "numpy>=1.26,<2",
    "torch>=2.1,<3",
    "scikit-learn>=1.3,<1.7",
]

[project.optional-dependencies]
preprocess = ["mdtraj>=1.9.9,<1.11", "networkx>=3.1,<4"]
plot = ["matplotlib>=3.7,<4"]
publication = ["pillow>=10.1,<13"]

[project.scripts]
bgan-eps = "bgan_eps_feoxo.main:main"
bgan-eps-xyz2bat = "bgan_eps_feoxo.xyz2bat:main"
bgan-eps-summary = "bgan_eps_feoxo.analysis:main"
bgan-eps-plot = "bgan_eps_feoxo.plot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bgan_eps_feoxo*"]

[tool.setuptools]
include-package-data = false
